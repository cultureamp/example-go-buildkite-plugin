version: "2"

formatters:
  disable:
    - gci
    - gofumpt

linters:
  default: all
  disable:
    - asciicheck
    - depguard
    - dupl
    - err113
    - errname
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - godot
    - godox
    - lll
    - nestif
    - nilnil
    - nlreturn
    - noinlineerr
    - paralleltest
    - prealloc
    - revive
    - tagliatelle
    - testpackage
    - unparam
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    gosec:
      # all rules enabled
      # see also: https://securego.io/docs/rules/rule-intro.html
      config:
        global:
          # allow #nosec override comments
          nosec: enabled
          # disable potentially noisy stricter audit mode
          audit: disabled
        G101: # "Look for hard-coded credentials"
          mode: strict
    cyclop:
      max-complexity: 20
